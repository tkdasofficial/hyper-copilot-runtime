name: Create Video Pipeline
run-name: Video - ${{ github.event.client_payload.title || github.event.client_payload.prompt || inputs.prompt || 'Manual Dispatch' }}

on:
  repository_dispatch:
    types: [create-video, create_video, long_form, long]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video Prompt / Title"
        required: true
        default: "The Mysteries of the Deep Sea Ecosystems"
      voice_gender:
        description: "Voice Gender (male/female)"
        required: false
        default: "male"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.video_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-render-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GDRIVE_MAIN_FOLDER_ID: ${{ secrets.GDRIVE_MAIN_FOLDER_ID || '1JGjibA287ds3SFoT_Fl2z8cJ96eCDUFs' }}
      GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
      GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
      GDRIVE_DELEGATED_USER: ${{ secrets.GDRIVE_DELEGATED_USER || 'tusharkantidasofficial@gmail.com' }}
      VIDEO_ID: ${{ github.event.client_payload.video_id || github.run_id }}
      USER_ID: ${{ github.event.client_payload.user_id || 'github_actions' }}
      PROMPT: ${{ github.event.client_payload.prompt || inputs.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender || inputs.voice_gender || 'male' }}
      VOICE_PERSONA: ${{ github.event.client_payload.voice_persona || github.event.client_payload.category || 'Documentary' }}
      VIDEO_STYLE: ${{ github.event.client_payload.visual_style || github.event.client_payload.image_style || 'Cinematic' }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio || '16:9' }}
      DURATION_SECONDS: ${{ github.event.client_payload.duration_seconds || '180' }}
      CAPTIONS: ${{ github.event.client_payload.captions || 'true' }}
      PIPELINE_MODE: "long"
      TARGET_RATIO: "16:9"
      RENDER_FPS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (C++, FFmpeg, Fonts & Edge-TTS)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libfreetype-dev libharfbuzz-dev nlohmann-json3-dev libomp-dev \
            ffmpeg fonts-noto-cjk fonts-dejavu-core fonts-freefont-ttf imagemagick
          sudo npm install -g edge-tts-node || true

      - name: Compile Native C++ Headless Video Editor Engine
        run: |
          chmod +x editor/build.sh
          ./editor/build.sh

      - name: Run Long Form Generator Pipeline (Zero Python)
        run: |
          node editor/pipeline.js

      - name: Export Directly to Google Drive (Videos Folder)
        if: success()
        run: |
          node editor/export_to_drive.js

      - name: Verify Completion in Supabase
        if: success() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          STATUS_VAL=$(curl -sS "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID&select=status" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].status // empty')
          echo "Supabase video status: '$STATUS_VAL'"
          if [ "$STATUS_VAL" != "completed" ]; then
            curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"completed","step":"Finished","progress":100}' || true
          fi
