name: Create Video

on:
  repository_dispatch:
    types: [long_form]

jobs:
  render-long-form:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
      GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
      GDRIVE_MAIN_FOLDER_ID: ${{ secrets.GDRIVE_MAIN_FOLDER_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIDEO_ID: ${{ github.event.client_payload.video_id }}
      USER_ID: ${{ github.event.client_payload.user_id }}
      PROMPT: ${{ github.event.client_payload.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
      VOICE_PERSONA: ${{ github.event.client_payload.voice_persona }}
      IMAGE_STYLE: ${{ github.event.client_payload.image_style }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio || '16:9' }}
      DURATION_SECONDS: ${{ github.event.client_payload.duration_seconds || '300' }}
      DURATION_MINUTES: ${{ github.event.client_payload.duration_minutes || '5' }}
      CAPTIONS: ${{ github.event.client_payload.captions }}
      CAPTION_SCALE: ${{ github.event.client_payload.caption_scale }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System & C++ Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libfreetype-dev libharfbuzz-dev nlohmann-json3-dev libomp-dev fonts-dejavu-core ffmpeg
          pip install requests edge-tts

      - name: Compile C++ Headless Editor
        run: |
          mkdir -p editor/build
          cd editor/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          ./hyper_editor --help

      - name: Mark processing in Supabase
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Initializing Long-Form Engine","progress":5}'

      - name: Execute Long-Form Video Pipeline (NVIDIA Brain, Pexels/Pixabay & C++ Editor)
        run: python editor/long_form_pipeline.py

      - name: Upload Master MP4 to Supabase Storage
        if: success()
        run: |
          if [ -f out.mp4 ]; then
            curl -sS -X POST \
              "$SUPABASE_URL/storage/v1/object/videos/$USER_ID/$VIDEO_ID.mp4" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: video/mp4" \
              -H "x-upsert: true" \
              --data-binary @out.mp4
          fi

      - name: Export Rendered Video to Google Drive
        if: success()
        run: |
          python editor/export_to_drive.py || true

      - name: Mark failed
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Long-form C++ pipeline failed. Check GitHub Actions logs."}'
