name: Video Agent Dual-Engine Runner

on:
  repository_dispatch:
    types: [short_form, long_form, video_agent_render]

jobs:
  # --------------------------------------------------------------------------
  # Short-Form Engine (mini-editor / render.py)
  # --------------------------------------------------------------------------
  render-short-form:
    if: github.event.action == 'short_form' || (github.event.action == 'video_agent_render' && github.event.client_payload.mode != 'long')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_LLM_MODEL: ${{ secrets.CF_LLM_MODEL }}
      CF_IMAGE_MODEL: ${{ secrets.CF_IMAGE_MODEL }}
      TTS_LANG: ${{ secrets.TTS_LANG }}
      EDGE_TTS_VOICE: ${{ secrets.EDGE_TTS_VOICE }}
      EDGE_TTS_RATE: ${{ secrets.EDGE_TTS_RATE }}
      EDGE_TTS_PITCH: ${{ secrets.EDGE_TTS_PITCH }}
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      PIXAZO_BASE_URL: ${{ secrets.PIXAZO_BASE_URL }}
      PIXAZO_IMAGE_MODEL: ${{ secrets.PIXAZO_IMAGE_MODEL }}
      VIDEO_ID: ${{ github.event.client_payload.video_id }}
      USER_ID: ${{ github.event.client_payload.user_id }}
      PROMPT: ${{ github.event.client_payload.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
      IMAGE_STYLE: ${{ github.event.client_payload.image_style }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio || '9:16' }}
      DURATION_SECONDS: ${{ github.event.client_payload.duration_seconds || '15' }}
      CAPTIONS: ${{ github.event.client_payload.captions }}
      CAPTION_SCALE: ${{ github.event.client_payload.caption_scale }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts

      - name: Mark processing in Supabase
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Writing script","progress":10}'

      - name: Render Short-Form Video (mini-editor)
        run: python mini-editor/render.py

      - name: Upload MP4 to Supabase Storage
        run: |
          curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/videos/$USER_ID/$VIDEO_ID.mp4" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: video/mp4" \
            -H "x-upsert: true" \
            --data-binary @out.mp4

      - name: Mark completed in Supabase
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"completed\",\"progress\":100,\"step\":\"Finished\",\"video_url\":\"$USER_ID/$VIDEO_ID.mp4\"}"

      - name: Mark failed
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Short-form render failed. Check GitHub Actions logs."}'

  # --------------------------------------------------------------------------
  # Long-Form Engine (editor / HyperEditor C++ Headless)
  # --------------------------------------------------------------------------
  render-long-form:
    if: github.event.action == 'long_form' || github.event.client_payload.mode == 'long'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIDEO_ID: ${{ github.event.client_payload.video_id }}
      USER_ID: ${{ github.event.client_payload.user_id }}
      PROMPT: ${{ github.event.client_payload.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender }}
      VOICE_PERSONA: ${{ github.event.client_payload.voice_persona }}
      IMAGE_STYLE: ${{ github.event.client_payload.image_style }}
      ASPECT_RATIO: ${{ github.event.client_payload.aspect_ratio || '16:9' }}
      DURATION_SECONDS: ${{ github.event.client_payload.duration_seconds || '300' }}
      DURATION_MINUTES: ${{ github.event.client_payload.duration_minutes || '5' }}
      CAPTIONS: ${{ github.event.client_payload.captions }}
      CAPTION_SCALE: ${{ github.event.client_payload.caption_scale }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System & C++ Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libfreetype-dev libharfbuzz-dev nlohmann-json3-dev libomp-dev fonts-dejavu-core ffmpeg
          pip install requests edge-tts

      - name: Compile C++ Headless Editor
        run: |
          mkdir -p editor/build
          cd editor/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          ./hyper_editor --help

      - name: Mark processing in Supabase
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Initializing Long-Form Engine","progress":5}'

      - name: Execute Long-Form Video Pipeline (Pexels, Pixabay, Ducking & C++ Editor)
        run: python editor/long_form_pipeline.py

      - name: Upload Master MP4 to Supabase Storage
        if: success()
        run: |
          if [ -f out.mp4 ]; then
            curl -sS -X POST \
              "$SUPABASE_URL/storage/v1/object/videos/$USER_ID/$VIDEO_ID.mp4" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: video/mp4" \
              -H "x-upsert: true" \
              --data-binary @out.mp4
          fi

      - name: Mark failed
        if: failure()
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Long-form C++ pipeline failed. Check GitHub Actions logs."}'
