name: Create Reel Pipeline
run-name: Reel - ${{ github.event.client_payload.title || github.event.client_payload.prompt || inputs.prompt || 'Manual Dispatch' }}

on:
  repository_dispatch:
    types: [create-reel, create_reel]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Reel / Short Prompt"
        required: true
        default: "Futuristic neon cyberpunk city in rain"
      negative_prompt:
        description: "Negative Prompt"
        required: false
        default: "blurry, distorted, low quality"
      voice_gender:
        description: "Voice Gender (male/female)"
        required: false
        default: "female"
      voice_persona:
        description: "Voice Persona"
        required: false
        default: "Dynamic Storyteller"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.video_id || github.run_id }}
  cancel-in-progress: false

jobs:
  build-and-render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GDRIVE_MAIN_FOLDER_ID: ${{ secrets.GDRIVE_MAIN_FOLDER_ID || '1JGjibA287ds3SFoT_Fl2z8cJ96eCDUFs' }}
      GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
      GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
      GDRIVE_DELEGATED_USER: ${{ secrets.GDRIVE_DELEGATED_USER || 'tusharkantidasofficial@gmail.com' }}
      VIDEO_ID: ${{ github.event.client_payload.video_id || github.run_id }}
      USER_ID: ${{ github.event.client_payload.user_id || 'github_actions' }}
      PROMPT: ${{ github.event.client_payload.prompt || inputs.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.voice_gender || inputs.voice_gender || 'female' }}
      VOICE_PERSONA: ${{ github.event.client_payload.voice_persona || 'Dynamic Storyteller' }}
      VIDEO_STYLE: ${{ github.event.client_payload.video_style || 'Cinematic' }}
      VIDEO_THEME: ${{ github.event.client_payload.video_theme || 'Dark Modern' }}
      CAPTION_POSITION: ${{ github.event.client_payload.caption_position || 'bottom' }}
      HIGHLIGHT_COLOR: ${{ github.event.client_payload.highlight_color || '#3b82f6' }}
      WORD_ACCENT_COLOR: ${{ github.event.client_payload.word_accent_color || '#fbbf24' }}
      ANIMATION_STYLE: ${{ github.event.client_payload.animation_style || 'pop' }}
      WATERMARK_ENABLED: ${{ github.event.client_payload.watermark_enabled || false }}
      WATERMARK_TEXT: ${{ github.event.client_payload.watermark_text || 'Hyper Copilot' }}
      BG_MUSIC_VOLUME: ${{ github.event.client_payload.bg_music_volume || 0.15 }}
      AUDIO_CROSSFADE_SEC: ${{ github.event.client_payload.audio_crossfade_sec || 0.5 }}
      AUDIO_NORMALIZE: ${{ github.event.client_payload.audio_normalize || true }}
      PIPELINE_MODE: "short"
      TARGET_RATIO: "9:16"
      RENDER_FPS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core fonts-freefont-ttf imagemagick

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests edge-tts pydub pillow numpy moviepy

      - name: Run Short Reel Generator Pipeline
        run: python editor/long_form_pipeline.py

      - name: Export Directly to Google Drive (Videos Folder)
        if: success()
        run: |
          python editor/export_to_drive.py

      - name: Verify Completion in Supabase
        if: success() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          STATUS_VAL=$(curl -sS "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID&select=status" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].status // empty')
          echo "Supabase video status: '$STATUS_VAL'"
          if [ "$STATUS_VAL" != "completed" ]; then
            curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"completed","step":"Finished","progress":100}' || true
          fi
