name: Reel
run-name: Reel - ${{ github.event.client_payload.prompt || inputs.prompt || github.event.client_payload.video_id || 'Render' }}

on:
  repository_dispatch:
    types: [reel, reel_dispatch, short_form, short, video_agent_render, create_reel, create-reel]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Reel Prompt"
        required: true
        default: "Cinematic vertical reel about deep space mysteries"
      captions:
        description: "Captions toggle (true/false)"
        required: false
        default: "true"
      voice_gender:
        description: "Voice Gender (male/female)"
        required: false
        default: "female"
      duration_seconds:
        description: "Duration in seconds"
        required: false
        default: "15"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.video_id || github.run_id }}
  cancel-in-progress: true

jobs:
  render-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
      PIXAZO_BASE_URL: ${{ secrets.PIXAZO_BASE_URL }}
      PIXAZO_IMAGE_MODEL: ${{ secrets.PIXAZO_IMAGE_MODEL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TTS_LANG: ${{ secrets.TTS_LANG }}
      EDGE_TTS_VOICE: ${{ secrets.EDGE_TTS_VOICE }}
      EDGE_TTS_RATE: ${{ secrets.EDGE_TTS_RATE }}
      EDGE_TTS_PITCH: ${{ secrets.EDGE_TTS_PITCH }}
      GOOGLE_CLOUD_API_ID: ${{ secrets.GOOGLE_CLOUD_API_ID }}
      GOOGLE_CLOUD_API_SECRET: ${{ secrets.GOOGLE_CLOUD_API_SECRET }}
      GDRIVE_DELEGATED_USER: ${{ secrets.GDRIVE_DELEGATED_USER || 'tusharkantidasofficial@gmail.com' }}
      GDRIVE_MAIN_FOLDER_ID: ${{ secrets.GDRIVE_MAIN_FOLDER_ID || '1JGjibA287ds3SFoT_Fl2z8cJ96eCDUFs' }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GDRIVE_CLIENT_EMAIL: ${{ secrets.GDRIVE_CLIENT_EMAIL }}
      GDRIVE_PRIVATE_KEY: ${{ secrets.GDRIVE_PRIVATE_KEY }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      VIDEO_ID: ${{ github.event.client_payload.identity.video_id || github.event.client_payload.video_id || github.run_id }}
      USER_ID: ${{ github.event.client_payload.identity.user_id || github.event.client_payload.user_id || 'github_actions' }}
      PROMPT: ${{ github.event.client_payload.content.prompt || github.event.client_payload.prompt || inputs.prompt }}
      NEGATIVE_PROMPT: ${{ github.event.client_payload.content.negative_prompt || github.event.client_payload.negative_prompt }}
      VOICE_GENDER: ${{ github.event.client_payload.audio.voice_gender || github.event.client_payload.voice_gender || inputs.voice_gender || 'female' }}
      VOICE_PERSONA: ${{ github.event.client_payload.audio.voice_persona || github.event.client_payload.voice_persona || 'Dynamic Storyteller' }}
      IMAGE_STYLE: ${{ github.event.client_payload.visual.image_style || github.event.client_payload.visual.visual_style || github.event.client_payload.image_style || 'Cinematic 3D' }}
      ASPECT_RATIO: ${{ github.event.client_payload.visual.aspect_ratio || github.event.client_payload.aspect_ratio || '9:16' }}
      DURATION_SECONDS: ${{ github.event.client_payload.timing.duration_seconds || github.event.client_payload.duration_seconds || inputs.duration_seconds || '15' }}
      CAPTIONS: ${{ github.event.client_payload.caption.captions || github.event.client_payload.captions || inputs.captions || 'true' }}
      CAPTION_SCALE: ${{ github.event.client_payload.caption.caption_scale || github.event.client_payload.caption_scale || '4' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System & C++ Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libavcodec-dev libavformat-dev libavfilter-dev libswscale-dev libswresample-dev libavutil-dev \
            libfreetype-dev libharfbuzz-dev nlohmann-json3-dev libomp-dev fonts-dejavu-core ffmpeg
          pip install requests edge-tts cryptography

      - name: Compile C++ Headless Editor
        run: |
          mkdir -p editor/build
          cd editor/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          ./hyper_editor --help || true

      - name: Mark processing in Supabase
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"processing","step":"Executing Reel Engine (9:16)","progress":10}' || true

      - name: Render Reel via Primary C++ Engine Pipeline
        run: |
          editor/build/hyper_pipeline || editor/build/hyper_long_form

      - name: Export Directly to Google Drive (Videos Folder)
        if: success()
        run: |
          editor/build/hyper_drive_export || true

      - name: Verify Completion in Supabase
        if: success() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          STATUS_VAL=$(curl -sS "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID&select=status" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || echo "")
          if [ "$STATUS_VAL" != "completed" ]; then
            curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"status":"completed","progress":100,"step":"Finished"}' || true
          fi

      - name: Mark failed
        if: failure() && env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: |
          curl -sS -X PATCH "$SUPABASE_URL/rest/v1/videos?id=eq.$VIDEO_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status":"failed","error":"Reel render failed. Check GitHub Actions logs."}' || true
