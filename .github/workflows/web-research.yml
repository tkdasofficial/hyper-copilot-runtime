name: Web Research

on:
  repository_dispatch:
    types: [web_research, public_research, private_research]
  workflow_dispatch:
    inputs:
      mode:
        description: "Research Mode (public or private)"
        required: true
        default: "public"
        type: choice
        options:
          - "public"
          - "private"
      query:
        description: "Research Query or Topic"
        required: true
        default: "Autonomous AI Agent architectures and headless browser execution"
      target_url:
        description: "Target URL / Portal (optional for public, required for private)"
        required: false
        default: ""
      auth_flow:
        description: "Authentication Flow (for private mode)"
        required: false
        default: "login"
        type: choice
        options:
          - "login"
          - "signup"
          - "none"
      auth_email:
        description: "User Email / Username (for private mode)"
        required: false
        default: ""
      otp_code:
        description: "Pre-supplied 2FA / OTP Verification Code (optional)"
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.research_id || github.run_id }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEARCH_AUTH_PASSWORD: ${{ secrets.RESEARCH_AUTH_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config chromium-browser
          pip install playwright requests beautifulsoup4
          playwright install --with-deps chromium

      - name: Build & Verify Native C++ Headless Browser Engine
        run: |
          mkdir -p editor/build
          cd editor/build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc) hyper_vision_agent_engine || true
          if [ -f ./hyper_vision_agent_engine ]; then
            echo "Native C++ Headless Browser built successfully."
            ./hyper_vision_agent_engine --help || ./hyper_vision_agent_engine --test || true
          fi

      - name: Execute Dual-Mode Web Research Agent
        env:
          RESEARCH_AUTH_EMAIL: ${{ github.event.client_payload.auth_email || inputs.auth_email }}
          OTP_CODE: ${{ github.event.client_payload.otp_code || inputs.otp_code }}
          CONFIRMATION_URL: ${{ github.event.client_payload.confirmation_url }}
          OTP_WAIT_TIMEOUT: "60"
        run: |
          MODE="${{ github.event.client_payload.mode || inputs.mode || 'public' }}"
          QUERY="${{ github.event.client_payload.query || inputs.query }}"
          TARGET_URL="${{ github.event.client_payload.target_url || inputs.target_url }}"
          AUTH_FLOW="${{ github.event.client_payload.auth_flow || inputs.auth_flow || 'login' }}"
          EMAIL="${{ github.event.client_payload.auth_email || inputs.auth_email }}"
          OTP="${{ github.event.client_payload.otp_code || inputs.otp_code }}"

          CMD="python web_researcher/research_agent.py --mode $MODE --query \"$QUERY\""

          if [ -n "$TARGET_URL" ]; then
            CMD="$CMD --url \"$TARGET_URL\""
          fi

          if [ "$MODE" = "private" ]; then
            CMD="$CMD --auth-flow $AUTH_FLOW"
            if [ -n "$EMAIL" ]; then
              CMD="$CMD --email \"$EMAIL\""
            fi
            if [ -n "$OTP" ]; then
              CMD="$CMD --otp \"$OTP\""
            fi
          fi

          echo "Executing research pipeline: $CMD"
          eval $CMD

      - name: Upload Research Artifacts & Synthesis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-research-synthesis
          path: |
            research_output/research_report.md
            research_output/research_report.json
            research_output/screenshots/
          if-no-files-found: ignore
