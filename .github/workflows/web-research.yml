name: Web Research
run-name: Research - ${{ github.event.client_payload.target || github.event.client_payload.query || inputs.prompt || 'Execution' }}

on:
  repository_dispatch:
    types: [web-research, web_research, heavy_data_fetch, heavy_fetch]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Research Query / Target URL"
        required: true
        default: "Deep oceanic trenches and bioluminescent ecosystems"
      mode:
        description: "Mode: 'research' or 'fetch'"
        required: false
        default: "research"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.research_id || github.run_id }}
  cancel-in-progress: true

jobs:
  native-heavy-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Native C++ & Chromium Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake pkg-config chromium-browser libpthread-stubs0-dev

      - name: Build Native C++ Heavy Web Research Engine
        run: |
          cd web-research
          chmod +x build.sh run_heavy_fetch.sh
          ./build.sh

      - name: Execute Heavy Data Fetching via Native C++ Engine
        run: |
          cd web-research
          MODE="${{ github.event.client_payload.mode || inputs.mode || 'research' }}"
          TARGET="${{ github.event.client_payload.target || github.event.client_payload.query || github.event.client_payload.target_url || inputs.prompt }}"
          echo "Starting Native C++ Heavy Execution: Mode=$MODE, Target=$TARGET"
          if [ "$MODE" = "fetch" ] || [ "$MODE" = "--fetch" ]; then
            ./run_heavy_fetch.sh --fetch "$TARGET"
          else
            ./run_heavy_fetch.sh --research "$TARGET"
          fi

      - name: Upload Research Dossier & Visual Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-research-artifacts
          path: |
            web-research/out/
            web-research/*.json
            web-research/*.png
            web-research/*.pdf
          if-no-files-found: ignore
